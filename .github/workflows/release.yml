name: Release
on: workflow_call

permissions: write-all

jobs:
  run:
    if: ${{ github.ref_name == 'main' || github.ref_name == 'develop'}}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.after.outputs.released }}
      version: ${{ steps.after.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 22.23.4
          cache: yarn
      - name: Echo versions
        run: |
          node --version
          yarn --version
      - name: Install dependencies
        run: yarn --prefer-offline
        env:
          HUSKY: 0
      - name: Lint app
        run: yarn lint
      - name: Build app
        run: yarn build
      - name: Record HEAD before release
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: npx semantic-release
      - name: Detect new release
        id: after
        run: |
          # @semantic-release/git commits the version bump locally and pushes it,
          # so HEAD changes if (and only if) a release was made.
          if [ "$(git rev-parse HEAD)" != "${{ steps.before.outputs.sha }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Configure git
        if: ${{ github.ref_name == 'main'}}
        run: |
          git config --global user.name "turtlesocks-bot"
          git config --global user.email "turtlesocks-bot@users.noreply.github.com"
      - name: Sync Dev to Main
        if: ${{ github.ref_name == 'main'}}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout develop
          git merge main
          git push origin develop

  # Build the image only after semantic-release has pushed the
  # "chore(release)" commit, so package.json holds the new version.
  docker:
    needs: run
    if: ${{ !cancelled() && needs.run.result == 'success' }}
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.run.outputs.released == 'true' && needs.run.outputs.version || '' }}
